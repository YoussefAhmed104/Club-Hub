      <div class="archived" id="archived">

        </div>
      </div>
      <div class="scroll">
        <ul>
          <li><a href="./club_details.html">General</a></li>
          <li><a href="./members_list.html">Members</a></li>
          <li><a href="./tasks.html">Tasks</a></li>
          <li><a href="./copetetion.html">Competitions</a></li>
        </ul>
        <div class="nav-indicator"></div>
