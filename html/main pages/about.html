<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clubhub | About</title>
    <link rel="stylesheet" href="../../css/main pages/about.css" />
    <!-- Fixed Styling -->
    <link rel="stylesheet" href="../../css/fixed style/dashboard.css" />
    <link rel="stylesheet" href="../../css/fixed style/javaclasses.css" />
    <!-- Render all elements noramlly -->
    <link rel="stylesheet" href="../../css/normalize.css" />
    <!-- My own framework -->
    <link rel="stylesheet" href="../../css/framework.css" />
    <!-- Fontawesome Library -->
    <link rel="stylesheet" href="../../css/all.min.css" />
    <!-- Fixed JS -->
    <script src="../../javascript/dash.js" defer></script>
  </head>
  <body>
    <!-- header -->
    <header id="header">
      <div class="container between-flex">
        <div class="left-half ideal-flex">
          <div class="burger cursor-pointer" id="headBurger">
            <i class="fa-regular fa-chart-bar"></i>
          </div>
          <div class="icon ideal-flex">
            <img
              class="stemVct cursor-pointer"
              src="../imgs/STEM Vector.svg"
              alt=""
            />
            <span>Club hub</span>
          </div>
        </div>

        <div class="others ideal-flex">
          <div class="joinOrCreate p-relative">
            <i class="fa-solid fa-plus plus"></i>
            <div class="list p-absolute">
              <ul>
                <li>Join class</li>
                <li>Create class</li>
              </ul>
            </div>
          </div>
          <div class="notification p-relative">
            <i class="fa-regular fa-bell bell"></i>
            <i class="fa-solid fa-circle p-absolute dot"></i>
          </div>
          <div class="account ideal-flex">
            <img
              class="img-account h-full"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRP9J5MY-KtK-6YZA2VccpymCFyJSbVm39k2BFsq3Kn_A&s=10"
              alt="image"
            />
          </div>
        </div>
      </div>
    </header>
    <!-- root page -->
    <div class="root-page d-flex">
      <!-- side-bar -->
      <div class="side-bar" id="sideBar">
        <div class="home" id="home">
          <a href=""><i class="fa-solid fa-house"></i> <span>Home</span></a>
        </div>

        <div class="calender" id="calender">
          <a href=""
            ><i class="fa-solid fa-calendar"></i> <span>Calender</span></a
          >
        </div>

        <hr class="mb-30" />

        <div class="enrolled" id="enrolled">
          <a href=""
            ><i class="fa-solid fa-graduation-cap"></i>
            <span>Enrolled classes</span></a
          >
        </div>

        <hr class="mb-30" />

        <div class="archived" id="archived">
          <a href=""
            ><i class="fa-solid fa-file-arrow-down"></i>
            <span>Archived</span></a
          >
        </div>

        <div class="settings" id="settings">
          <a href=""><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
        </div>
        <div class="about" id="about">
          <a href=""
            ><img
              class="stemVct cursor-pointer"
              src="../imgs/STEM Vector.svg"
              alt=""
            />
            <span>About</span></a
          >
        </div>
      </div>

      <!-- container -->
      <div class="container flex-1" id="container">
        <div class="image">
          <div class="logo d-flex">
            <img src="../imgs/STEM Vector.svg" alt="" />
            <div class="spans">
              <span>stem egypt</span>
              <span>High School for Boys | 6th of October</span>
            </div>
          </div>
          <div class="inspire ideal-flex">
            New community | New goals | New life
          </div>
          <div class="info">
            <div>
              <i class="fa-solid fa-location-dot"></i> Cosmic Village, 6th of
              October, Giza - Egypt
            </div>
            <div class="">
              <i class="fa-solid fa-school"></i>Ranked #1 High School in Egypt
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
