<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Hub | Dashboard</title>
    <link rel="stylesheet" href="../css/home/dashboard.css" />
    <!-- Render all elements noramlly -->
    <link rel="stylesheet" href="../../css/normalize.css" />
    <!-- My own framework -->
    <link rel="stylesheet" href="../../css/framework.css" />
    <!-- Fontawesome Library -->
    <link rel="stylesheet" href="../../css/all.min.css" />
    <!-- <script src="../../javascript/Registration/interests.js" defer></script> -->
  </head>
  <body>
    <!-- header -->
    <header id="header">
      <div class="container between-flex">
        <div class="left-half ideal-flex pl-23">
          <div class="burger cursor-pointer" id="headBurger">
            <i class="fa-regular fa-chart-bar"></i>
          </div>
          <div class="icon ideal-flex">
            <img
              class="stemVct cursor-pointer"
              src="imgs/STEM Vector.svg"
              alt=""
            />
            <span>Club hub</span>
          </div>
        </div>

        <div class="others ideal-flex">
          <div class="joinOrCreate p-relative">
            <i class="fa-solid fa-plus plus"></i>
            <div class="list p-absolute">
              <ul>
                <li>Join class</li>
                <li>Create class</li>
              </ul>
            </div>
          </div>
          <div class="notification p-relative">
            <i class="fa-regular fa-bell bell"></i>
            <i class="fa-solid fa-circle p-absolute dot"></i>
          </div>
          <div class="account">
            <img
              class="img-account h-full"
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRP9J5MY-KtK-6YZA2VccpymCFyJSbVm39k2BFsq3Kn_A&s=10"
              alt="image"
            />
          </div>
        </div>
      </div>
    </header>
    <!-- side-bar -->
    <div class="side-bar" id="sideBar">
      <div class="commuinty" id="commuinty">
        <a href=""
          ><img
            class="stemVct cursor-pointer"
            src="imgs/STEM Vector.svg"
            alt=""
          />
          <span>Commuinty</span></a
        >
      </div>

      <div class="home" id="home">
        <a href=""><i class="fa-solid fa-house"></i> <span>Home</span></a>
      </div>

      <div class="calender" id="calender">
        <a href=""
          ><i class="fa-solid fa-calendar"></i> <span>Calender</span></a
        >
      </div>

      <hr class="mb-30" />

      <div class="enrolled" id="enrolled">
        <a href=""
          ><i class="fa-solid fa-graduation-cap"></i>
          <span>Enrolled classes</span></a
        >
      </div>

      <hr class="mb-30" />

      <div class="archived" id="archived">
        <a href=""
          ><i class="fa-solid fa-file-arrow-down"></i> <span>Archived</span></a
        >
      </div>

      <div class="settings" id="settings">
        <a href=""><i class="fa-solid fa-gear"></i> <span>Settings</span></a>
      </div>
    </div>
    <script>
      const header = document.getElementById("header");

      window.addEventListener("scroll", function () {
        if (window.scrollY > 20) {
          header.classList.add("scroll");
        } else {
          header.classList.remove("scroll");
        }
      });

      let burger = document.getElementById("headBurger");
      let side_bar = document.getElementById("sideBar");
      burger.addEventListener("click", function () {
        side_bar.classList.toggle("open");
      });

      const logo = document.querySelector(".stemVct");
      logo.addEventListener("click", function () {
        window.open("https://www.stemegypt.net/", "_blank");
      });

      const join = document.querySelector(".joinOrCreate");
      join.addEventListener("click", function () {
        join.classList.toggle("active");
      });

      const titles = document.querySelectorAll(".side-bar > div");

      titles.forEach((title) => {
        title.addEventListener("click", function (event) {
          event.preventDefault();
          titles.forEach((item) => item.classList.remove("active"));
          title.classList.add("active");
        });
      });
    </script>
  </body>
</html>
